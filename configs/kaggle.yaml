# Kaggle training config (T4/P100 GPU — 16 GB VRAM)
# Run inside the updated notebook with:
#   python /kaggle/input/fridge-detector/scripts/train.py \
#       --config /kaggle/input/fridge-detector/configs/kaggle.yaml \
#       --data-dir /kaggle/input/<your-roboflow-dataset>

backbone: resnet50
fpn_channels: 256
image_size: 512
epochs: 50
batch_size: 16
lr: 1.0e-4
weight_decay: 1.0e-4
num_workers: 4
checkpoint_dir: /kaggle/working/checkpoints
